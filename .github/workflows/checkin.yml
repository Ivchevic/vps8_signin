name: VPS8 Private Pull Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: '52 0 * * *' # 北京时间 08:30
    
permissions:
  actions: write
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出私有仓库代码
        uses: actions/checkout@v4
        with:
          repository: acwea904/vps8_signin_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private_code

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-wqy-zenhei

      - name: 运行自动签到脚本
        env:
          VPS8_ACCOUNT: ${{ secrets.VPS8_ACCOUNT }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          cd private_code
          xvfb-run --auto-servernum python vps8_signin.py

      - name: 上传截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Checkin-Screenshots
          path: private_code/checkin_result_*.png
          retention-days: 7
          
      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
