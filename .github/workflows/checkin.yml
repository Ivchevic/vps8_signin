name: VPS8 Private Pull Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # 北京时间 08:30

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出私有仓库代码
        uses: actions/checkout@v3
        with:
          # 修改为你的 GitHub 用户名/私有仓库名
          repository: acwea904/vps8_signin_Private
          # 使用你在 Secrets 中配置的令牌
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          # 检出到当前路径
          path: private_code

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-wqy-zenhei

      - name: 运行自动签到脚本
        env:
          VPS8_ACCOUNT: ${{ secrets.VPS8_ACCOUNT }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          # 注意：因为上面使用了 path: private_code，所以这里要进入该目录运行
          cd private_code
          xvfb-run --auto-servernum python vps8_signin.py

      - name: 上传截图
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: Checkin-Screenshots
          path: private_code/checkin_result_*.png
          retention-days: 7
